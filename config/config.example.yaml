# 复制为 config.yaml 后按需修改。config.yaml 已被 .gitignore 忽略。
Server:
  Name: gobili-api
  Host: 0.0.0.0
  Port: 8888
  LogLevel: INFO # DEBUG / INFO / WARN / ERROR

MySQL:
  Host: 127.0.0.1
  Port: 3306
  Database: gobili
  Username: gobili
  Password: gobili
  Charset: utf8mb4
  # 这两个必须表达同一个时区，否则 created_at 与 updated_at 会差几个小时。
  # Loc 影响驱动如何解析 DATETIME，TimeZone 影响数据库 CURRENT_TIMESTAMP。
  Loc: Asia/Shanghai
  TimeZone: "+08:00"

Redis:
  Addr: 127.0.0.1:6379
  Password: ""
  DB: 0

MinIO:
  Endpoint: 127.0.0.1:9000
  AccessKey: gobili
  SecretKey: gobili123
  UseSSL: false
  # 对外可访问的对象存储基地址，用于拼接返回给客户端的 URL
  PublicBaseURL: http://127.0.0.1:9000/gobili

# 生产环境务必替换为随机密钥：openssl rand -base64 32
JWT:
  AccessSecret: change-me-access
  RefreshSecret: change-me-refresh
  AccessTTL: 2h
  RefreshTTL: 168h

Snowflake:
  DatacenterID: 0
  WorkerID: 0

Chat:
  Host: 0.0.0.0
  Port: 8889
  # 浏览器页面需要把来源填进来；留空则只允许不带 Origin 的客户端
  AllowedOrigins: []

Kafka:
  Brokers:
    - 127.0.0.1:9092
  GroupID: gobili-worker
  # 留空则用 PATH 里的 ffmpeg；worker 用它把视频第 0 帧抽成封面
  FfmpegPath: ""

# 服务注册与发现。微服务启动时把 Name 注册进来，网关按 Name 查找。
Etcd:
  Endpoints:
    - 127.0.0.1:2379

Services:
  User:
    Name: gobili.user
    Host: 0.0.0.0
    Port: 8881
  Video:
    Name: gobili.video
    Host: 0.0.0.0
    Port: 8882
  Comment:
    Name: gobili.comment
    Host: 0.0.0.0
    Port: 8883
