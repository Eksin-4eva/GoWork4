# 复制为 config.yaml 后按需修改。config.yaml 已被 .gitignore 忽略。
Server:
  Name: gobili-api
  Host: 0.0.0.0
  Port: 8888
  LogLevel: INFO # DEBUG / INFO / WARN / ERROR

MySQL:
  Host: 127.0.0.1
  Port: 3306
  Database: gobili
  Username: gobili
  Password: gobili
  Charset: utf8mb4

Redis:
  Addr: 127.0.0.1:6379
  Password: ""
  DB: 0

MinIO:
  Endpoint: 127.0.0.1:9000
  AccessKey: gobili
  SecretKey: gobili123
  UseSSL: false
  # 对外可访问的对象存储基地址，用于拼接返回给客户端的 URL
  PublicBaseURL: http://127.0.0.1:9000/gobili

# 生产环境务必替换为随机密钥：openssl rand -base64 32
JWT:
  AccessSecret: change-me-access
  RefreshSecret: change-me-refresh
  AccessTTL: 2h
  RefreshTTL: 168h

Snowflake:
  DatacenterID: 0
  WorkerID: 0
