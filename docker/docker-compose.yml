name: gobili

services:
  mysql:
    image: mysql:8.0
    container_name: gobili-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: gobili
      MYSQL_USER: gobili
      MYSQL_PASSWORD: gobili
      # 与应用保持同一时区：否则建表脚本里的 CURRENT_TIMESTAMP 会按 UTC 写入
      TZ: Asia/Shanghai
    command: --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动（数据卷为空）时自动建表；结构变更请改 config/sql/init.sql
      - ../config/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gobili-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    # MinIO 已不再向 Docker Hub 发布，官方镜像在 quay.io
    image: quay.io/minio/minio:latest
    container_name: gobili-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gobili
      MINIO_ROOT_PASSWORD: gobili123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  kafka:
    # 用 KRaft 模式，不再需要 ZooKeeper
    image: apache/kafka:latest
    container_name: gobili-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 两套监听器：宿主机上的应用连 9092，容器里的应用连 29092。
      # 只配一套的话，总有一边的地址是连不通的——
      # 容器里的 127.0.0.1 指向它自己，宿主机上的 kafka 又解析不到。
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092,INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      # 单节点必须把副本因子降为 1，否则创建内部 topic 会失败
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 只有一个 broker，没必要为组重平衡等 3 秒
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  etcd:
    # 服务注册与发现：微服务启动时把地址注册进来，网关按服务名查找。
    # 有了它，微服务扩容/重启/换机器都不需要改网关的配置。
    image: gcr.io/etcd-development/etcd:v3.5.0
    container_name: gobili-etcd
    command:
      - /usr/local/bin/etcd
      - --name=etcd0
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://0.0.0.0:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd0=http://0.0.0.0:2380
      - --initial-cluster-state=new
    ports:
      - "2379:2379"
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 三个进程共用一个镜像，只是启动命令不同。
  #
  # 拆成三个服务而不是在一个容器里用 shell `&` 启动：
  # 后者会吞掉除最后一个之外所有进程的退出码，哪个挂了 Docker 都看不见。
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: gobili/app:latest
    container_name: gobili-api
    command: ["./bin/api", "-f", "config/config.yaml"]
    environment:
      # 与应用时区保持一致：Go 的 time.Now() 也会用到它，
      # 不设的话日志与聊天消息的时间戳会是 UTC，而库里是 +08:00
      TZ: Asia/Shanghai
    ports:
      - "8888:8888"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      etcd:
        condition: service_healthy
      minio:
        condition: service_started
    # MinIO 没有健康检查（镜像里没有可用的探测工具），
    # 所以万一 api 先于它起来会启动失败，靠重启策略兜住
    restart: unless-stopped

  chat:
    image: gobili/app:latest
    container_name: gobili-chat
    command: ["./bin/chat", "-f", "config/config.yaml"]
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8889:8889"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: gobili/app:latest
    container_name: gobili-worker
    command: ["./bin/worker", "-f", "config/config.yaml"]
    environment:
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  user:
    image: gobili/app:latest
    container_name: gobili-user
    command: ["./bin/user", "-f", "config/config.yaml"]
    ports:
      - "8881:8881"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      etcd:
        condition: service_healthy
    restart: unless-stopped

  video:
    image: gobili/app:latest
    container_name: gobili-video
    command: ["./bin/video", "-f", "config/config.yaml"]
    ports:
      - "8882:8882"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      etcd:
        condition: service_healthy
    restart: unless-stopped

  comment:
    image: gobili/app:latest
    container_name: gobili-comment
    command: ["./bin/comment", "-f", "config/config.yaml"]
    ports:
      - "8883:8883"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      etcd:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  minio_data:
  kafka_data:
  etcd_data:
