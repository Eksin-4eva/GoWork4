name: gobili

services:
  mysql:
    image: mysql:8.0
    container_name: gobili-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: gobili
      MYSQL_USER: gobili
      MYSQL_PASSWORD: gobili
      # 与应用保持同一时区：否则建表脚本里的 CURRENT_TIMESTAMP 会按 UTC 写入
      TZ: Asia/Shanghai
    command: --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动（数据卷为空）时自动建表；结构变更请改 config/sql/init.sql
      - ../config/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gobili-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    # MinIO 已不再向 Docker Hub 发布，官方镜像在 quay.io
    image: quay.io/minio/minio:latest
    container_name: gobili-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gobili
      MINIO_ROOT_PASSWORD: gobili123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  kafka:
    # 用 KRaft 模式，不再需要 ZooKeeper
    image: apache/kafka:latest
    container_name: gobili-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # 应用跑在宿主机上，所以对外宣告 127.0.0.1；
      # 将来应用也进容器时，这里要改成 kafka:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      # 单节点必须把副本因子降为 1，否则创建内部 topic 会失败
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 只有一个 broker，没必要为组重平衡等 3 秒
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  minio_data:
  kafka_data:
